<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام الجسيمات ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    font-family: sans-serif;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  #hint {
    position: fixed;
    top: 20px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.6);
    font-size: 16px;
    pointer-events: none;
    transition: opacity 0.5s;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">المس الشاشة ✨</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

// ضبط دقة عالية لـ iPhone Retina
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

const particles = [];
const MAX_PARTICLES = 500;

class Particle {
  constructor(x, y, isBurst = false) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = isBurst ? Math.random() * 6 + 2 : Math.random() * 2 + 0.5;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = Math.random() * 0.012 + 0.006;
    // 👇 حجم أكبر بكثير ليكون مرئياً على iPhone
    this.size = Math.random() * 6 + 3;
    const hue = Math.random() * 60 + 180;
    this.color = `hsl(${hue}, 100%, 65%)`;
    this.gravity = 0.06;
    this.friction = 0.985;
  }

  update() {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw() {
    if (this.life <= 0) return;
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 20;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function addParticle(x, y, isBurst = false) {
  if (particles.length < MAX_PARTICLES) {
    particles.push(new Particle(x, y, isBurst));
  }
}

function burst(x, y, count = 40) {
  for (let i = 0; i < count; i++) addParticle(x, y, true);
}

function animate() {
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  // خلفية شبه شفافة لتأثير الذيل
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // جسيمات تلقائية من المركز
  if (Math.random() < 0.4 && particles.length < MAX_PARTICLES) {
    addParticle(window.innerWidth / 2, window.innerHeight / 2);
  }

  requestAnimationFrame(animate);
}

// بدء التشغيل
setTimeout(() => {
  // انفجار ترحيبي عند الفتح
  burst(window.innerWidth / 2, window.innerHeight / 2, 80);
  animate();
}, 100);

// ============ التفاعل باللمس ============
function handleTouch(e) {
  e.preventDefault();
  hint.style.opacity = '0';
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    burst(t.clientX, t.clientY, 30);
  }
}

canvas.addEventListener('touchstart', handleTouch, { passive: false });
canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  hint.style.opacity = '0';
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    for (let j = 0; j < 3; j++) addParticle(t.clientX, t.clientY);
  }
}, { passive: false });

// ============ التفاعل بالماوس ============
canvas.addEventListener('mousemove', (e) => {
  hint.style.opacity = '0';
  addParticle(e.clientX, e.clientY);
});
canvas.addEventListener('click', (e) => {
  burst(e.clientX, e.clientY, 50);
});

setTimeout(() => hint.style.opacity = '0', 4000);
</script>
</body>
</html>
