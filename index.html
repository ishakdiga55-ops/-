<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>سماء النجوم ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    font-family: -apple-system, sans-serif;
  }
  canvas { display: block; }
  #title {
    position: fixed;
    top: 20px;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(100,200,255,0.6);
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">⭐ بناء الهرم ⭐</div>

<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = window.innerWidth;
var H = window.innerHeight;

// دقة عالية
var dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);

// ==========================================
// 🎨 الألوان
// ==========================================
var COLORS = [
  '#00d4ff', '#4facfe', '#00f2fe', '#43e97b', 
  '#38f9d7', '#fbbf24', '#f59e0b', '#f472b6',
  '#a855f7', '#818cf8'
];

// ==========================================
// 📐 حساب نقاط الهرم
// ==========================================
function buildPyramidPoints() {
  var points = [];
  var baseY = H * 0.85;
  var tipY = H * 0.25;
  var pyramidW = Math.min(W * 0.85, H * 0.7);
  var pyramidH = baseY - tipY;
  var cx = W / 2;
  
  // طبقات الهرم
  var rows = 20;
  
  for (var row = 0; row < rows; row++) {
    var t = row / (rows - 1);
    var y = tipY + t * pyramidH;
    var rowWidth = t * pyramidW;
    
    // كل طبقة أوسع من السابقة
    var countInRow = Math.max(2, Math.floor(row * 2 + 2));
    
    // نقاط على جانبي الهرم فقط (لا نملأ الداخل)
    for (var j = 0; j < countInRow; j++) {
      var frac = j / (countInRow - 1);
      var x = cx - rowWidth / 2 + frac * rowWidth;
      // كل نقطة لها حجم مختلف قليلاً
      points.push({
        x: x + (Math.random() - 0.5) * 3,
        y: y + (Math.random() - 0.5) * 3,
        size: 3 + Math.random() * 2,
        hue: 180 + t * 60 + Math.random() * 30
      });
    }
  }
  
  return points;
}

// ==========================================
// ⭐ نظام النجوم
// ==========================================
var stars = [];        // النجوم الساقطة
var pyramid = [];      // جسيمات الهرم المتراكم
var pyramidPoints = []; // نقاط الهرم المستهدفة
var nextPointIndex = 0; // النقطة التالية للبناء
var buildState = 'building'; // 'building' أو 'collapsing'
var buildTimer = 0;

var MAX_STARS = 300;

// إنشاء نقطة الهرم
function rebuildPyramidPoints() {
  pyramidPoints = buildPyramidPoints();
  nextPointIndex = 0;
}

// ==========================================
// 🌟 نجمة ساقطة
// ==========================================
function createStar() {
  var x = Math.random() * W;
  var y = -20;
  var speed = 2 + Math.random() * 3;
  var angle = (Math.random() - 0.5) * 0.5; // ميل خفيف
  
  return {
    x: x,
    y: y,
    vx: Math.sin(angle) * speed * 0.5,
    vy: speed,
    size: 2 + Math.random() * 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    trail: [],           // ذيل النجمة
    life: 1,
    targetIndex: -1,     // النقطة التي ستتوجه إليها
    mode: 'falling',     // 'falling' → 'moving' → 'settled'
    twinkle: Math.random() * Math.PI * 2
  };
}

// ==========================================
// 🎬 حلقة الرسم
// ==========================================
var lastStarTime = 0;
var frameCount = 0;

function loop(now) {
  frameCount++;
  
  // خلفية سوداء شبه شفافة (تأثير ذيل للنجوم)
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, W, H);
  
  // ==========================================
  // 1. إصدار نجوم جديدة (فقط في وضع البناء)
  // ==========================================
  if (buildState === 'building' && stars.length < MAX_STARS) {
    if (now - lastStarTime > 60) {
      stars.push(createStar());
      lastStarTime = now;
    }
  }
  
  // ==========================================
  // 2. تحديث النجوم
  // ==========================================
  for (var i = stars.length - 1; i >= 0; i--) {
    var s = stars[i];
    
    if (s.mode === 'falling') {
      // تسقط
      s.x += s.vx;
      است s.y += s.vy;
      s.twinkle += 0.2;
      
      // إضافة نقطة للذيل
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > 8) s.trail.shift();
      
      // وصلت لمستوى الهرم؟ ابدأ التحرك نحو هدفها
      if (s.y > H * 0.35 && nextPointIndex < pyramidPoints.length) {
        s.mode = 'moving';
        s.targetIndex = nextPointIndex;
        nextPointIndex++;
      }
      
    } else if (s.mode === 'moving') {
      // تتحرك نحو نقطتها في الهرم
      var target = pyramidPoints[s.targetIndex];
      var dx = target.x - s.x;
      var dy = target.y - s.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 3) {
        //قرت في مكانها
        s.mode = 'settled';
        s.x = target.x;
        s.y = target.y;
        s.size = target.size;
        // انقلها لقائمة الهرم
        pyramid.push(s);
        stars.splice(i, 1);
        continue;
      } else {
        s.x += dx * 0.08;
        s.y += dy * 0.08;
        s.twinkle += 0.3;
      }
    }
    
    // حذف النجوم الخارجة عن الشاشة
    if (s.x < -50 || s.x > W + 50 || s.y > H + 50) {
      stars.splice(i, 1);
      continue;
    }
  }
  
  // ==========================================
  // 3. رسم النجوم
  // ==========================================
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    
    // رسم الذيل
    for (var t = 0; t < s.trail.length; t++) {
      var tr = s.trail[t];
      var alpha = (t / s.trail.length) * 0.5;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, s.size * (t / s.trail.length), 0, Math.PI * 2);
      ctx.fill();
    }
    
    // رسم النجمة الرئيسية
    var twinkleSize = s.size + Math.sin(s.twinkle) * 0.8;
    ctx.globalAlpha = 1;
    ctx.fillStyle = s.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, twinkleSize, 0, Math.PI * 2);
    ctx.fill();
    
    // نقطة بيضاء في المركز للتوهج
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, twinkleSize * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // ==========================================
  // 4. رسم الهرم المتراكم
  // ==========================================
  for (var i = 0; i < pyramid.length; i++) {
    var p = pyramid[i];
    p.twinkle += 0.05;
    var twinkleSize = p.size + Math.sin(p.twinkle) * 0.3;
    
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, twinkleSize, 0, Math.PI * 2);
    ctx.fill();
    
    // نقطة بيضاء صغيرة
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(p.x, p.y, twinkleSize * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // ==========================================
  // 5. إدارة الحالة
  // ==========================================
  if (buildState === 'building') {
    // اكتمل الهرم؟
    if (nextPointIndex >= pyramidPoints.length && pyramid.length > 0) {
      buildTimer += 16;
      if (buildTimer > 2000) { // انتظر ثانيتين
        buildState = 'collapsing';
        buildTimer = 0;
      }
    }
  } else if (buildState === 'collapsing') {
    // انهيار الهرم
    for (var i = 0; i < pyramid.length; i++) {
      var p = pyramid[i];
      p.x += (Math.random() - 0.5) * 3;
      p.y += 3 + Math.random() * 2;
      p.size *= 0.99;
    }
    
    // إزالة الجسيمات الخارجة
    pyramid = pyramid.filter(function(p) {
      return p.y < H + 30 && p.size > 0.5;
    });
    
    // انتظر ثم ابدأ من جديد
    buildTimer += 16;
    if (buildTimer > 1500) {
      pyramid = [];
      stars = [];
      nextPointIndex = 0;
      rebuildPyramidPoints();
      buildState = 'building';
      buildTimer = 0;
    }
  }
  
  // إعادة تعيين
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  requestAnimationFrame(loop);
}

// ==========================================
// 📱 التفاعل - لمس لإضافة نجوم سريعة
// ==========================================
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (var k = 0; k < 10; k++) {
    stars.push(createStar());
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  for (var k = 0; k < 15; k++) {
    stars.push(createStar());
  }
});

document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
window.addEventListener('resize', function() {
  // إعادة الحساب عند تغيير الحجم
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.scale(dpr, dpr);
});

// ==========================================
// 🚀 بدء التشغيل
// ==========================================
rebuildPyramidPoints();
requestAnimationFrame(loop);
</script>
</body>
</html>
