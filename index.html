<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Geometric Particles ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; touch-action: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, sans-serif;
  }
  #canvas { display: block; position: fixed; inset: 0; }
  #ui {
    position: fixed; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 40px 20px; color: rgba(255,255,255,0.7); font-size: 13px;
  }
  #shapeName {
    text-align: center; font-size: 18px; font-weight: 600;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 0 20px rgba(100,200,255,0.9);
    transition: opacity 0.5s;
  }
  #stats {
    display: flex; justify-content: space-between;
    font-family: 'SF Mono', monospace; font-size: 11px;
    color: rgba(255,255,255,0.4);
  }
  #stats span {
    background: rgba(255,255,255,0.05);
    padding: 4px 8px; border-radius: 6px;
    backdrop-filter: blur(10px);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div id="shapeName">✦ مثلث ✦</div>
  <div id="stats">
    <span id="fps">-- FPS</span>
    <span id="count">0 جسيم</span>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fps');
const countEl = document.getElementById('count');
const shapeNameEl = document.getElementById('shapeName');

let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}
resize();
window.addEventListener('resize', () => setTimeout(() => { resize(); rebuildShape(); }, 150));
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); rebuildShape(); }, 300));

// ==========================================
// 🎨 مُولّدات الأشكال الهندسية
// ==========================================
function getShapePoints(shapeName, cx, cy, size) {
  const points = [];
  const N = 220; // عدد النقاط في الشكل

  switch (shapeName) {
    case 'triangle': {
      // مثلث متساوي الأضلاع
      const a = -Math.PI / 2;
      const verts = [];
      for (let i = 0; i < 3; i++) {
        verts.push({
          x: cx + Math.cos(a + i * 2 * Math.PI / 3) * size,
          y: cy + Math.sin(a + i * 2 * Math.PI / 3) * size
        });
      }
      for (let i = 0; i < N; i++) {
        const t = i / N * 3;
        const side = Math.floor(t) % 3;
        const local = t - Math.floor(t);
        const p1 = verts[side];
        const p2 = verts[(side + 1) % 3];
        points.push({
          x: p1.x + (p2.x - p1.x) * local,
          y: p1.y + (p2.y - p1.y) * local
        });
      }
      break;
    }

    case 'square': {
      const half = size;
      const perim = 8 * half;
      for (let i = 0; i < N; i++) {
        const t = (i / N) * perim;
        let x, y;
        if (t < 2 * half) {
          x = cx - half + t; y = cy - half;
        } else if (t < 4 * half) {
          x = cx + half; y = cy - half + (t - 2 * half);
        } else if (t < 6 * half) {
          x = cx + half - (t - 4 * half); y = cy + half;
        } else {
          x = cx - half; y = cy + half - (t - 6 * half);
        }
        points.push({ x, y });
      }
      break;
    }

    case 'circle': {
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        points.push({
          x: cx + Math.cos(a) * size,
          y: cy + Math.sin(a) * size
        });
      }
      break;
    }

    case 'star': {
      const spikes = 5;
      const outer = size;
      const inner = size * 0.4;
      const step = Math.PI / spikes;
      const verts = [];
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outer : inner;
        const a = i * step - Math.PI / 2;
        verts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
      }
      for (let i = 0; i < N; i++) {
        const t = i / N * verts.length;
        const idx = Math.floor(t) % verts.length;
        const local = t - Math.floor(t);
        const p1 = verts[idx];
        const p2 = verts[(idx + 1) % verts.length];
        points.push({
          x: p1.x + (p2.x - p1.x) * local,
          y: p1.y + (p2.y - p1.y) * local
        });
      }
      break;
    }

    case 'heart': {
      // معادلة القلب
      for (let i = 0; i < N; i++) {
        const t = (i / N) * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        points.push({
          x: cx + x * (size / 16),
          y: cy + y * (size / 16)
        });
      }
      break;
    }

    case 'spiral': {
      const turns = 4;
      for (let i = 0; i < N; i++) {
        const t = i / N;
        const a = t * turns * Math.PI * 2;
        const r = t * size;
        points.push({
          x: cx + Math.cos(a) * r,
          y: cy + Math.sin(a) * r
        });
      }
      break;
    }

    case 'hexagon': {
      const verts = [];
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3 - Math.PI / 2;
        verts.push({ x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size });
      }
      for (let i = 0; i < N; i++) {
        const t = i / N * 6;
        const idx = Math.floor(t) % 6;
        const local = t - Math.floor(t);
        const p1 = verts[idx];
        const p2 = verts[(idx + 1) % 6];
        points.push({
          x: p1.x + (p2.x - p1.x) * local,
          y: p1.y + (p2.y - p1.y) * local
        });
      }
      break;
    }

    case 'infinity': {
      // رمز ∞
      for (let i = 0; i < N; i++) {
        const t = (i / N) * Math.PI * 2;
        const x = Math.cos(t) / (1 + Math.pow(Math.sin(t), 2));
        const y = Math.sin(t) * Math.cos(t) / (1 + Math.pow(Math.sin(t), 2));
        points.push({
          x: cx + x * size * 1.8,
          y: cy + y * size * 1.8
        });
      }
      break;
    }
  }

  return points;
}

// ==========================================
// 🎯 نظام الجسيمات
// ==========================================
class Particle {
  constructor() {
    this.active = false;
    this.hue = 0;
  }

  // الوضع 1: يتحرك نحو هدف (لتشكيل الشكل)
  setTarget(tx, ty, hue) {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.tx = tx;
    this.ty = ty;
    this.vx = 0;
    this.vy = 0;
    this.life = 1.0;
    this.maxLife = 1.0;
    this.decay = 0;
    this.size = Math.random() * 2.5 + 1.5;
    this.hue = hue;
    this.mode = 'target';
    this.active = true;
    this.wobble = Math.random() * Math.PI * 2;
  }

  // الوضع 2: ينفجر من نقطة
  setBurst(x, y, hue) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 2;
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.maxLife = 1.0;
    this.decay = Math.random() * 0.012 + 0.006;
    this.size = Math.random() * 3 + 2;
    this.hue = hue;
    this.mode = 'free';
    this.active = true;
    this.wobble = Math.random() * Math.PI * 2;
  }

  update(dt) {
    if (!this.active) return;

    if (this.mode === 'target') {
      // انجذاب ناعم نحو الهدف
      const dx = this.tx - this.x;
      const dy = this.ty - this.y;
      this.vx = (this.vx + dx * 0.08) * 0.85;
      this.vy = (this.vy + dy * 0.85 * 0.08) * 0.85;
      this.x += this.vx * dt;
      this.y += this.vy * dt;

      // اهتزاز خفيف
      this.wobble += 0.05 * dt;
      this.x += Math.cos(this.wobble) * 0.3;
      this.y += Math.sin(this.wobble) * 0.3;

      // اكتمل الوصول؟
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 3) {
        // يبدأ بالتلاشي ببطء
        this.decay = 0.008;
      }
    } else {
      // حركة حرة
      this.vx *= 0.985;
      this.vy *= 0.985;
      this.vy += 0.08;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.life -= this.decay * dt;
    }

    // في وضع الهدف، الحياة تبقى 1 حتى الوصول
    if (this.mode === 'target' && this.decay > 0) {
      this.life -= this.decay * dt;
    }

    if (this.life <= 0) {
      this.active = false;
    }
  }

  draw() {
    if (!this.active || this.life <= 0) return;

    const alpha = Math.max(0, this.life);
    const radius = this.size * this.life;

    ctx.globalAlpha = alpha;
    ctx.fillStyle = `hsl(${this.hue}, 100%, 65%)`;
    ctx.shadowBlur = 12 * this.life;
    ctx.shadowColor = `hsl(${this.hue}, 100%, 70%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==========================================
// 🎭 مدير الأشكال
// ==========================================
const pool = [];
const active = [];
const MAX = 1500;

function getParticle() {
  if (pool.length > 0) return pool.pop();
  return new Particle();
}

function burst(x, y, count, hue) {
  for (let i = 0; i < count && active.length < MAX; i++) {
    const p = getParticle();
    p.setBurst(x, y, hue);
    active.push(p);
  }
}

// الأشكال المتاحة
const SHAPES = ['triangle', 'square', 'circle', 'star', 'heart', 'hexagon', 'spiral', 'infinity'];
const SHAPE_NAMES = {
  triangle: '✦ مثلث ✦',
  square: '◆ مربع ◆',
  circle: '● دائرة ●',
  star: '★ نجمة ★',
  heart: '♥ قلب ♥',
  hexagon: '⬡ سداسي ⬡',
  spiral: '🌀 حلزوني 🌀',
  infinity: '∞ لانهاية ∞'
};

let currentShapeIndex = 0;
letShape shapeParticles = [];

// بناء الشكل الحالي
function rebuildIndexShape() {
  // انفجار الشكل القديم
  for (const p of shapeParticles) {
    if (p.active) {
      p.mode = 'free';
      p.vx = (p.x - W / 2) * 0.05 + (Math.random() - 0.5) * 4;
      p.vy = (p` يد.y - H / 2) * 0.05 + (Math.random() - 0.5) * 4;
      p.decay = Math.random() * 0.015 + 0.008;
    }
  }

  // اسمح لها بالانطلاق
  active.push(...shapeParticles);
  shapeParticles = [];

  const shape = SHAPES[currentShapeIndex];
  const size = Math.min(W, H) * 0.28;
  const cx = W / 2;
  const cy = H / 2;
  const points = getShapePoints(shape, cx, cy, size);

  // لون حسب الشكل
  const baseHue = (currentShapeIndex * 45) % 360;

  for (const pt of points) {
    if (active.length >= MAX) break;
    const p = getParticle();
    const hue = baseHue + (Math.random() - 0.5) * 40;
    p.setTarget(pt.x, pt.y, hue);
    shapeParticles.push(p);
  }

  shapeNameEl.textContent = SHAPE_NAMES[shape];
  shapeNameEl.style.opacity = '1';

  // انفجار احتفالي صغير
  burst(cx, cy, 30, baseHue);

  // انتقل للشكل التالي
  currentShapeIndex = (currentShapeIndex + 1) % SHAPES.length;

  // جدولة الشكل التالي
  setTimeout(rebuildShape, 4000);
}

// ==========================================
// 🎬 حلقة الرسم
// ==========================================
let lastTime = performance.now();
let frameCount = 0;
let fpsTimer = performance.now();

function loop(now) {
  const rawDt = (now - lastTime) / 16.667;
  lastTime = now;
  const dt = Math.min(rawDt, 3);

  // خلفية شبه شفافة
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(0, 0, W, H);

  // تحديث
  for (let i = active.length - 1; i >= 0; i--) {
    const p = active[i];
    p.update(dt);
    if (!p.active) {
      active.splice(i, 1);
      pool.push(p);
    }
  }

  // رسم
  for (let i = 0; i < active.length; i++) {
    active[i].draw();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // إحصائيات
  frameCount++;
  if (now - fpsTimer > 500) {
    const fps = Math.round(frameCount * 1000 / (now - fpsTimer));
    fpsEl.textContent = fps + ' FPS';
    countEl.textContent = active.length + ' جسيم';
    frameCount = 0;
    fpsTimer = now;
  }

  requestAnimationFrame(loop);
}

// ==========================================
// 👆 التفاعل باللمس - يطلق انفجارات
// ==========================================
function onTouch(e) {
  e.preventDefault();
  for (let i = 0; i < e.touches.length; i++) {
    const t = e.touches[i];
    const hue = (performance.now() * 0.1) % 360;
    burst(t.clientX, t.clientY, 25, hue);
  }
}

canvas.addEventListener('touchstart', onTouch, { passive: false });
canvas.addEventListener('touchmove', onTouch, { passive: false });
canvas.addEventListener('touchend', e => e.preventDefault(), { passive: false });

// ماوس
canvas.addEventListener('mousedown', (e) => {
  burst(e.clientX, e.clientY, 40, Math.random() * 360);
});
canvas.addEventListener('mousemove', (e) => {
  if (e.buttons === 1) burst(e.clientX, e.clientY, 8, Math.random() * 360);
});

// منع zoom
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

// ==========================================
// 🚀 بدء التشغيل
// ==========================================
requestAnimationFrame(loop);

// انتظر قليلاً ثم ابدأ بالأشكال
setTimeout(() => {
  rebuildShape();
}, 500);
</script>
</body>
</html>
