<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>أشكال</title>
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; }
  #n {
    position: fixed; top: 30px; left: 0; right: 0;
    text-align: center;
    color: #fff; font-size: 20px; font-family: sans-serif;
    font-weight: bold;
    text-shadow: 0 0 20px #4af, 0 0 40px #4af;
    pointer-events: none;
    z-index: 100;
  }
  #status {
    position: fixed; bottom: 30px; left: 0; right: 0;
    text-align: center;
    color: #0f0; font-size: 14px; font-family: monospace;
    pointer-events: none;
    z-index: 100;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="n">مثلث ✦</div>
<div id="status">جاري التحميل...</div>

<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var nameEl = document.getElementById('n');
var statusEl = document.getElementById('status');
var W = window.innerWidth;
var H = window.innerHeight;

// دقة عالية للشاشات الحديثة
var dpr = window.devicePixelRatio || 1;
if (dpr > 2) dpr = 2;
canvas.width = W * dpr;
canvas.height = H * dpr;
canvas.style.width = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);

ctx.fillStyle = '#000';
ctx.fillRect(0, 0, W, H);

// ============ البيانات ============
var particles = [];
var COLORS = ['#00d4ff', '#0080ff', '#00ffcc', '#a855f7', '#ec4899', '#fbbf24'];
var SHAPES = ['مثلث ✦', 'مربع ◆', 'دائرة ●', 'نجمة ★', 'قلب ♥', 'سداسي ⬡'];
var currentShape = 0;
var frameCount = 0;

// ============ حساب نقاط الشكل ============
function getPoints(shape, cx, cy, size, count) {
  var pts = [];
  var i, t, a;
  
  if (shape === 0) {
    // مثلث
    var v = [];
    for (i = 0; i < 3; i++) {
      a = -Math.PI/2 + i * 2 * Math.PI / 3;
      v.push({x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size});
    }
    for (i = 0; i < count; i++) {
      t = (i / count) * 3;
      var side = Math.floor(t) % 3;
      var local = t - Math.floor(t);
      var p1 = v[side];
      var p2 = v[(side + 1) % 3];
      pts.push({x: p1.x + (p2.x - p1.x) * local, y: p1.y + (p2.y - p1.y) * local});
    }
  } else if (shape === 1) {
    // مربع
    for (i = 0; i < count; i++) {
      t = i / count;
      var x, y;
      if (t < 0.25) { x = cx - size + t * 4 * size; y = cy - size; }
      else if (t < 0.5) { x = cx + size; y = cy - size + (t - 0.25) * 4 * size; }
      else if (t < 0.75) { x = cx + size - (t - 0.5) * 4 * size; y = cy + size; }
      else { x = cx - size; y = cy + size - (t - 0.75) * 4 * size; }
      pts.push({x: x, y: y});
    }
  } else if (shape === 2) {
    // دائرة
    for (i = 0; i < count; i++) {
      a = (i / count) * Math.PI * 2;
      pts.push({x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size});
    }
  } else if (shape === 3) {
    // نجمة
    var spikes = 5;
    var outer = size, inner = size * 0.4;
    var step = Math.PI / spikes;
    var verts = [];
    for (i = 0; i < spikes * 2; i++) {
      var r = (i % 2 === 0) ? outer : inner;
      a = i * step - Math.PI / 2;
      verts.push({x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r});
    }
    for (i = 0; i < count; i++) {
      t = (i / count) * verts.length;
      var idx = Math.floor(t) % verts.length;
      var local = t - Math.floor(t);
      var p1 = verts[idx];
      var p2 = verts[(idx + 1) % verts.length];
      pts.push({x: p1.x + (p2.x - p1.x) * local, y: p1.y + (p2.y - p1.y) * local});
    }
  } else if (shape === 4) {
    // قلب
    for (i = 0; i < count; i++) {
      t = (i / count) * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      pts.push({x: cx + hx * (size / 16), y: cy + hy * (size / 16)});
    }
  } else {
    // سداسي
    var v = [];
    for (i = 0; i < 6; i++) {
      a = i * Math.PI / 3 - Math.PI / 2;
      v.push({x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size});
    }
    for (i = 0; i < count; i++) {
      t = (i / count) * 6;
      var idx = Math.floor(t) % 6;
      var local = t - Math.floor(t);
      var p1 = v[idx];
      var p2 = v[(idx + 1) % 6];
      pts.push({x: p1.x + (p2.x - p1.x) * local, y: p1.y + (p2.y - p1.y) * local});
    }
  }
  
  return pts;
}

// ============ بناء الشكل ============
function buildShape() {
  // حرر الجسيمات القديمة
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    if (p.mode === 'shape') {
      p.mode = 'free';
      p.vx = (p.x - W/2) * 0.15 + (Math.random() - 0.5) * 8;
      p.vy = (p.y - H/2) * 0.15 + (Math.random() - 0.5) * 8;
      p.decay = 0.025;
    }
  }
  
  var size = Math.min(W, H) * 0.3;
  var cx = W / 2;
  var cy = H / 2;
  var count = 150;
  var points = getPoints(currentShape, cx, cy, size, count);
  var color = COLORS[currentShape % COLORS.length];
  
  // أنشئ جسيمات جديدة
  for (var i = 0; i < points.length; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      tx: points[i].x,
      ty: points[i].y,
      vx: 0,
      vy: 0,
      life: 1,
      decay: 0,
      reached: false,
      size: 4 + Math.random() * 3,
      color: color,
      mode: 'shape',
      wobble: Math.random() * Math.PI * 2
    });
  }
  
  nameEl.textContent = SHAPES[currentShape];
  statusEl.textContent = 'الجسيمات: ' + particles.length;
  currentShape = (currentShape + 1) % SHAPES.length;
  
  setTimeout(buildShape, 4500);
}

// ============ انفجار عند اللمس ============
function burst(x, y) {
  var color = COLORS[Math.floor(Math.random() * COLORS.length)];
  for (var i = 0; i < 20; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.random() * 7 + 3;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.015,
      reached: true,
      size: 4 + Math.random() * 3,
      color: color,
      mode: 'free',
      wobble: 0
    });
  }
}

// ============ حلقة الرسم ============
function loop() {
  frameCount++;
  statusEl.textContent = 'الجسيمات: ' + particles.length + ' | إطار: ' + frameCount;
  
  // خلفية شبه شفافة (تأثير ذيل)
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, 0, W, H);
  
  // تحديث ورسم الجسيمات
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    
    if (p.mode === 'shape') {
      var dx = p.tx - p.x;
      var dy = p.ty - p.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist > 3) {
        // انجذاب نحو الهدف
        p.vx = (p.vx + dx * 0.15) * 0.7;
        p.vy = (p.vy + dy * 0.15) * 0.7;
        p.x += p.vx;
        p.y += p.vy;
      } else {
        // وصل الهدف - اهتزاز خفيف
        p.wobble += 0.15;
        p.x = p.tx + Math.cos(p.wobble) * 2;
        p.y = p.ty + Math.sin(p.wobble) * 2;
        p.reached = true;
        
        // ابدأ التلاشي بعد وقت
        if (!p.fadeStart) {
          p.fadeStart = Date.now();
        } else if (Date.now() - p.fadeStart > 1500) {
          p.life -= 0.02;
        }
      }
    } else {
      // حركة حرة
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.vy += 0.1;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
    }
    
    // حذف الميت
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    
    // رسم الجسيم
    var alpha = p.life;
    if (alpha > 1) alpha = 1;
    if (alpha < 0) alpha = 0;
    var radius = p.size * alpha;
    if (radius < 1) continue;
    
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  requestAnimationFrame(loop);
}

// ============ التفاعل ============
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    burst(e.touches[i].clientX, e.touches[i].clientY);
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    burst(e.touches[i].clientX, e.touches[i].clientY);
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  burst(e.clientX, e.clientY);
});

document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

// ============ بدء التشغيل ============
statusEl.textContent = 'حلقة الرسم تعمل...';
requestAnimationFrame(loop);
buildShape();
</script>
</body>
</html>
