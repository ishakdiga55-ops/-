<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>أشكال</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none;
  }
  #c { display: block; position: fixed; top:0; left:0; }
  #n {
    position: fixed; top: 30px; width: 100%; text-align: center;
    color: #fff; font-size: 20px; font-family: sans-serif;
    font-weight: bold; text-shadow: 0 0 20px #4af;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="n">مثلث</div>

<script>
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var nameEl = document.getElementById('n');
var W = 0, H = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
}
resize();
window.onresize = resize;

// ============ الجسيمات ============
var particles = [];
var COLORS = ['#00d4ff', '#0080ff', '#00ffcc', '#a855f7', '#ec4899', '#fbbf24', '#22d3ee', '#f472b6'];

// نقاط الشكل
function getPoints(shape, cx, cy, size, count) {
  var pts = [];
  var i, t, a;
  
  if (shape === 0) {
    // مثلث
    var v = [];
    for (i = 0; i < 3; i++) {
      a = -Math.PI/2 + i * 2 * Math.PI / 3;
      v.push({x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size});
    }
    for (i = 0; i < count; i++) {
      t = (i / count) * 3;
      var side = Math.floor(t) % 3;
      var local = t - Math.floor(t);
      var p1 = v[side];
      var p2 = v[(side + 1) % 3];
      pts.push({x: p1.x + (p2.x - p1.x) * local, y: p1.y + (p2.y - p1.y) * local});
    }
  } else if (shape === 1) {
    // مربع
    for (i = 0; i < count; i++) {
      t = i / count;
      var x, y;
      if (t < 0.25) { x = cx - size + t * 4 * size; y = cy - size; }
      else if (t < 0.5) { x = cx + size; y = cy - size + (t - 0.25) * 4 * size; }
      else if (t < 0.75) { x = cx + size - (t - 0.5) * 4 * size; y = cy + size; }
      else { x = cx - size; y = cy + size - (t - 0.75) * 4 * size; }
      pts.push({x: x, y: y});
    }
  } else if (shape === 2) {
    // دائرة
    for (i = 0; i < count; i++) {
      a = (i / count) * Math.PI * 2;
      pts.push({x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size});
    }
  } else if (shape === 3) {
    // نجمة
    var spikes = 5;
    var outer = size, inner = size * 0.4;
    var step = Math.PI / spikes;
    var verts = [];
    for (i = 0; i < spikes * 2; i++) {
      var r = (i % 2 === 0) ? outer : inner;
      a = i * step - Math.PI / 2;
      verts.push({x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r});
    }
    for (i = 0; i < count; i++) {
      t = (i / count) * verts.length;
      var idx = Math.floor(t) % verts.length;
      var local = t - Math.floor(t);
      var p1 = verts[idx];
      var p2 = verts[(idx + 1) % verts.length];
      pts.push({x: p1.x + (p2.x - p1.x) * local, y: p1.y + (p2.y - p1.y) * local});
    }
  } else if (shape === 4) {
    // قلب
    for (i = 0; i < count; i++) {
      t = (i / count) * Math.PI * 2;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      pts.push({x: cx + hx * (size / 16), y: cy + hy * (size / 16)});
    }
  } else if (shape === 5) {
    // سداسي
    var v = [];
    for (i = 0; i < 6; i++) {
      a = i * Math.PI / 3 - Math.PI / 2;
      v.push({x: cx + Math.cos(a) * size, y: cy + Math.sin(a) * size});
    }
    for (i = 0; i < count; i++) {
      t = (i / count) * 6;
      var idx = Math.floor(t) % 6;
      var local = t - Math.floor(t);
      var p1 = v[idx];
      var p2 = v[(idx + 1) % 6];
      pts.push({x: p1.x + (p2.x - p1.x) * local, y: p1.y + (p2.y - p1.y) * local});
    }
  } else if (shape === 6) {
    // حلزوني
    for (i = 0; i < count; i++) {
      t = i / count;
      a = t * 5 * Math.PI * 2;
      var r = t * size;
      pts.push({x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r});
    }
  } else {
    // لا نهاية
    for (i = 0; i < count; i++) {
      t = (i / count) * Math.PI * 2;
      var x = Math.cos(t) / (1 + Math.sin(t) * Math.sin(t));
      var y = Math.sin(t) * Math.cos(t) / (1 + Math.sin(t) * Math.sin(t));
      pts.push({x: cx + x * size * 1.8, y: cy + y * size * 1.8});
    }
  }
  
  return pts;
}

var SHAPES = ['مثلث ✦', 'مربع ◆', 'دائرة ●', 'نجمة ★', 'قلب ♥', 'سداسي ⬡', 'حلزوني 🌀', 'لانهاية ∞'];
var currentShape = 0;

function buildShape() {
  // حرر الجسيمات القديمة
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    if (p.mode === 'shape') {
      p.mode = 'free';
      p.vx = (p.x - W/2) * 0.1 + (Math.random() - 0.5) * 6;
      p.vy = (p.y - H/2) * 0.1 + (Math.random() - 0.5) * 6;
      p.decay = 0.02;
    }
  }
  
  var size = Math.min(W, H) * 0.28;
  var cx = W / 2;
  var cy = H / 2;
  var count = 180;
  var points = getPoints(currentShape, cx, cy, size, count);
  var color = COLORS[currentShape % COLORS.length];
  
  // أنشئ جسيمات جديدة
  for (var i = 0; i < points.length; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      tx: points[i].x,
      ty: points[i].y,
      vx: 0,
      vy: 0,
      life: 1,
      decay: 0,
      size: Math.random() * 2.5 + 2,
      color: color,
      mode: 'shape'
    });
  }
  
  nameEl.textContent = SHAPES[currentShape];
  currentShape = (currentShape + 1) % SHAPES.length;
  
  setTimeout(buildShape, 4000);
}

// انفجار عند اللمس
function burst(x, y) {
  var color = COLORS[Math.floor(Math.random() * COLORS.length)];
  for (var i = 0; i < 20; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.random() * 6 + 2;
    particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.012,
      size:== Math.random() * 3 + 2,
=
      color: color,
      mode:canvas.addEventListener '('free'
    });
  }
}

touch// ============ حلقة الرسم ============
function loop() {
  // خلفية شبه شفافة
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(0, 0, W, H);
  
  // تحديث ورسم
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    
    if (p.mode === 'shape') {
      var dx = p.tx - p.x;
      var dy = p.ty - p.y;
      p.vx = (p.vx + dx * 0.1) * 0.82;
      p.vy = (p.vy + dy * 0.1) * 0.82;
      p.x += p.vx;
      p.y += p.vy;
      if (Math.abs(dx) < 5 && Math.abs(dy) < 5 && p.decay === 0) {
        p.decay = 0.006;
      }
      if (p.decay > 0) p.life -= p.decay;
    } else {
      p.vx *= 0.98;
      p.vy *= 0.98;
      p.vy += 0.08;
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
    }
    
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    
    var alpha = p.life;
    if (alpha > 1) alpha = 1;
    if (alpha < 0) alpha = 0;
    var radius = p.size * alpha;
    if (radius < 0.3) continue;
    
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  requestAnimationFrame(loop);
}

// ============ التفاعل =========start', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    burst(e.touches[i].clientX, e.touches[i].clientY);
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    burst(e.touches[i].clientX, e.touches[i].clientY);
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  burst(e.clientX, e.clientY);
});

document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

// ============ بدء ============
requestAnimationFrame(loop);
setTimeout(buildShape, 300);
</script>
</body>
</html>
