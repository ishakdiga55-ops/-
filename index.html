<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>نظام الجسيمات ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    touch-action: none;
  }
  canvas {
    display: block;
    background: #000;
    cursor: crosshair;
  }
  #hint {
    position: fixed;
    top: 20px;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    pointer-events: none;
    transition: opacity 0.5s;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="hint">المس الشاشة أو حرّك الماوس ✨</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// نظام الجسيمات
const particles = [];
const MAX_PARTICLES = 800;

class Particle {
  constructor(x, y, isBurst = false) {
    this.x = x;
    this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = isBurst ? Math.random() * 8 + 2 : Math.random() * 3 + 1;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1.0;
    this.decay = Math.random() * 0.015 + 0.008;
    this.size = Math.random() * 3 + 1;
    // ألوان جميلة
    const hue = Math.random() * 60 + 180; // أزرق-بنفسجي
    this.color = `hsl(${hue}, 100%, 60 %)`;
    this.gravity = 0.08 for;
    this.friction = 0.98;
  }

 (  update() {
    this.vletx *= this.friction;
    this i.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw() {
    if (this.life <= 0) return;
    const alpha = Math.max(0, this.life);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fill();
  }
}

function addParticle(x, y, isBurst = false) {
  if (particles.length < MAX_PARTICLES) {
    particles.push(new Particle(x, y, isBurst));
  }
}

function burst(x, y, count = 50) {
  for (let i = 0; i < count; i++) {
    addParticle(x, y, true);
  }
}

// حلقة الرسم
function animate() {
  // تأثير تلاشي الخلفية
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // تحديث ورسم الجسيمات
 = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // جسيمات تلقائية من المركز
  if (Math.random() < 0.5 && particles.length < MAX_PARTICLES) {
    addParticle(canvas.width / 2, canvas.height / 2);
  }

  requestAnimationFrame(animate);
}
animate();

// التفاعل مع الماوس
let mouseDown = false;

canvas.addEventListener('mousemove', (e) => {
  hint.style.opacity = '0';
  addParticle(e.clientX, e.clientY);
});

canvas.addEventListener('mousedown', (e) => {
  mouseDown = true;
  burst(e.clientX, e.clientY, 60);
});

canvas.addEventListener('mouseup', () => mouseDown = false);

// التفاعل مع اللمس (للهاتف)
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  hint.style.opacity = '0';
  for (let touch of e.touches) {
    burst(touch.clientX, touch.clientY, 60);
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (let touch of e.touches) {
    for (let i = 0; i < 3; i++) {
      addParticle(touch.clientX, touch.clientY);
    }
  }
}, { passive: false });

// إخفاء التلميح تلقائياً
setTimeout(() => hint.style.opacity = '0', 5000);
</script>
</body>
</html>
