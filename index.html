<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000">
<title>MONOLITH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Helvetica Neue', -apple-system, sans-serif;
    color: #fff;
  }
  canvas { display: block; position: fixed; inset: 0; }
  
  /* ============ HUD ============ */
  .hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 24px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 200;
  }
  
  .hud-left, .hud-right {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .hud-right { align-items: flex-end; }
  
  .label {
    color: rgba(255,255,255,0.35);
    font-size: 9px;
    letter-spacing: 4px;
  }
  
  .value {
    color: rgba(140,220,255,0.9);
    font-size: 14px;
    letter-spacing: 2px;
    font-weight: 300;
    text-shadow: 0 0 15px rgba(80,200,255,0.8);
    font-variant-numeric: tabular-nums;
  }
  
  .phase-name {
    color: rgba(255,255,255,0.95);
    font-size: 11px;
    letter-spacing: 5px;
    font-weight: 400;
  }
  
  /* Progress Bar */
  .progress-wrap {
    margin-top: 10px;
    width: 120px;
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 1px;
    overflow: hidden;
  }
  
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4af, #0ff);
    box-shadow: 0 0 10px #4af;
    transition: width 0.3s ease-out;
  }
  
  /* Bottom Title */
  .bottom-brand {
    position: fixed;
    bottom: 30px;
    left: 0; right: 0;
    text-align: center;
    pointer-events: none;
    z-index: 10;
  }
  
  .brand {
    font-size: 9px;
    letter-spacing: 12px;
    color: rgba(255,255,255,0.25);
    font-weight: 200;
    text-transform: uppercase;
  }
  
  /* Pulsing dot */
  .live-dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #0ff;
    box-shadow: 0 0 8px #0ff;
    margin-right: 8px;
    vertical-align: middle;
    animation: livePulse 2s ease-in-out infinite;
  }
  
  @keyframes livePulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; box-shadow: 0 0 15px #0ff; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="hud-left">
    <div class="label">PHASE</div>
    <div class="phase-name"><span class="live-dot"></span><span id="phase">CONSTRUCT</span></div>
    <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
  </div>
  <div class="hud-right">
    <div class="label">PARTICLES</div>
    <div class="value" id="counter">0000</div>
    <div class="label" style="margin-top:8px">FPS</div>
    <div class="value" id="fps">60</div>
  </div>
</div>

<div class="bottom-brand">
  <div class="brand">◈ MONOLITH ◈</div>
</div>

<script>
'use strict';

// ============================================================
// MONOLITH — Cinematic Particle Pyramid
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const phaseEl = document.getElementById('phase');
const counterEl = document.getElementById('counter');
const fpsEl = document.getElementById('fps');
const progressEl = document.getElementById('progress');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initStars();
  buildPyramid();
}
resize();
window.addEventListener('resize', () => setTimeout(resize, 200));

// ============================================================
// 🎨 COLOR SYSTEM — Teal & Orange (cinematic palette)
// ============================================================
const PALETTE = {
  primary:   { h: 195, s: 100, l: 60 },   // cyan
  secondary: { h: 280, s: 90,  l: 65 },   // violet
  accent:    { h: 35,  s: 100, l: 60 },   // orange
  highlight: { h: 180, s: 100, l: 75 }    // light cyan
};

function hsl(h, s, l, a) {
  if (a === undefined) return `hsl(${h}, ${s}%, ${l}%)`;
  return `hsla(${h}, ${s}%, ${l}%, ${a})`;
}

// ============================================================
// 🌌 STARFIELD (3D depth layers)
// ============================================================
let starLayers = [];

function initStars() {
  starLayers = [
    { stars: [], count: 200, size: 0.5, alpha: 0.3, speed: 0.02, parallax: 0.05 },
    { stars: [], count: 120, size: 0.9, alpha: 0.6, speed: 0.05, parallax: 0.1 },
    { stars: [], count: 50,  size: 1.5, alpha: 0.9, speed: 0.1,  parallax: 0.2 }
  ];
  
  for (const layer of starLayers) {
    for (let i = 0; i < layer.count; i++) {
      layer.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        phase: Math.random() * Math.PI * 2,
        freq: 0.5 + Math.random() * 2
      });
    }
  }
}

// ============================================================
// 🔺 PYRAMID TARGETS
// ============================================================
let pyramidTargets = [];
let totalPoints = 0;

function buildPyramid() {
  pyramidTargets = [];
  
  const baseY = H * 0.86;
  const tipY = H * 0.18;
  const pyramidH = baseY - tipY;
  const pyramidW = Math.min(W * 0.9, H * 0.8);
  const cx = W / 2;
  
  const rows = 24;
  
  for (let row = 0; row < rows; row++) {
    const t = row / (rows - 1);
    const y = tipY + t * pyramidH;
    const width = t * pyramidW;
    
    const countInRow = Math.max(1, Math.floor(1 + t * 16));
    
    for (let j = 0; j < countInRow; j++) {
      const frac = countInRow === 1 ? 0.5 : j / (countInRow - 1);
      const x = cx - width / 2 + frac * width;
      
      // Gradient from cyan to violet to orange
      let hue;
      if (t < 0.5) {
        hue = PALETTE.primary.h + (PALETTE.secondary.h - PALETTE.primary.h) * (t / 0.5);
      } else {
        hue = PALETTE.secondary.h + (PALETTE.accent.h - PALETTE.secondary.h) * ((t - 0.5) / 0.5);
      }
      
      pyramidTargets.push({
        x: x,
        y: y,
        size: 2 + Math.random() * 1.5,
        hue: hue,
        row: row,
        t: t,
        reserved: false,
        settled: false,
        settleTime: 0
      });
    }
  }
  
  totalPoints = pyramidTargets.length;
}

// ============================================================
// ☄️ METEOR SYSTEM
// ============================================================
let meteors = [];
let lastSpawn = 0;
let spawnInterval = 55;

function spawnMeteor() {
  // Find next unreserved target (top to bottom)
  let targetIdx = -1;
  for (let i = 0; i < pyramidTargets.length; i++) {
    if (!pyramidTargets[i].reserved && !pyramidTargets[i].settled) {
      targetIdx = i;
      pyramidTargets[i].reserved = true;
      break;
    }
  }
  if (targetIdx < 0) return;
  
  // Meteor starts from top, random x
  const startX = Math.random() * W;
  const startY = -50 - Math.random() * 100;
  
  meteors.push({
    x: startX,
    y: startY,
    vx: (Math.random() - 0.5) * 2,
    vy: 4 + Math.random() * 3,
    size: 3 + Math.random() * 2,
    hue: pyramidTargets[targetIdx].hue,
    trail: [],
    maxTrail: 14,
    target: targetIdx,
    mode: 'falling',
    spin: Math.random() * Math.PI * 2,
    spinSpeed: 0.15 + Math.random() * 0.1
  });
}

// ============================================================
// 💫 DUST PARTICLES
// ============================================================
let dust = [];

function spawnDust(x, y, hue, count, power) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * power + 0.8;
    dust.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.8,
      size: 1.5 + Math.random() * 2.5,
      hue: hue,
      life: 1,
      decay: 0.018 + Math.random() * 0.02,
      gravity: 0.18
    });
  }
}

// ============================================================
// 🌊 SHOCKWAVES
// ============================================================
let shockwaves = [];

function spawnShockwave(x, y, hue) {
  shockwaves.push({
    x, y,
    r: 5,
    maxR: Math.max(W, H) * 0.7,
    hue: hue,
    life: 1,
    decay: 0.02,
    width: 3
  });
}

// ============================================================
// 🏛️ SETTLED PARTICLES
// ============================================================
let settled = [];

// ============================================================
// 🎬 SCENE STATE
// ============================================================
let phase = 'building';
let phaseTime = 0;
let builtCount = 0;
let startTime = performance.now();
let shakeAmount = 0;
let shakeX = 0, shakeY = 0;
let cameraRot = 0;
let flashAlpha = 0;

function resetScene() {
  meteors = [];
  dust = [];
  shockwaves = [];
  settled = [];
  builtCount = 0;
  phase = 'building';
  phaseTime = 0;
  shakeAmount = 0;
  flashAlpha = 0;
  buildPyramid();
  totalPoints = pyramidTargets.length;
  phaseEl.textContent = 'CONSTRUCT';
}

// ============================================================
// 🎥 MAIN RENDER LOOP
// ============================================================
let lastFrame = performance.now();
let frameCount = 0;
let fpsTimer = performance.now();

function render(now) {
  const dt = Math.min((now - lastFrame) / 16.667, 2.5);
  lastFrame = now;
  const t = now - startTime;
  
  // Camera shake
  if (shakeAmount > 0.2) {
    shakeX = (Math.random() - 0.5) * shakeAmount;
    shakeY = (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.92;
  } else {
    shakeX *= 0.85;
    shakeY *= 0.85;
  }
  
  ctx.save();
  ctx.translate(shakeX, shakeY);
  
  // ====== LAYER 1: Deep Space Background ======
  drawSpaceBackground(t);
  
  // ====== LAYER 2: Ground Grid ======
  drawGroundGrid(t);
  
  // ====== LAYER 3: Meteors Spawn ======
  if (phase === 'building' && builtCount < totalPoints) {
    if (now - lastSpawn > spawnInterval) {
      spawnMeteor();
      lastSpawn = now;
    }
  }
  
  // ====== LAYER 4: Update & Draw Meteors ======
  ctx.globalCompositeOperation = 'lighter';
  updateMeteors(dt);
  drawMeteors();
  
  // ====== LAYER 5: Draw Settled ======
  drawSettled(t, dt);
  
  // ====== LAYER 6: Dust ======
  updateDrawDust(dt);
  
  // ====== LAYER 7: Shockwaves ======
  updateDrawShockwaves(dt);
  
  // ====== LAYER 8: Chromatic Bloom ======
  drawBloom();
  
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  // ====== LAYER 9: Vignette ======
  drawVignette();
  
  // ====== LAYER 10: Flash ======
  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(180, 240, 255, ${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
    flashAlpha *= 0.9;
  }
  
  ctx.restore();
  
  // ====== STATE MANAGEMENT ======
  updateState(now);
  
  // ====== HUD ======
  frameCount++;
  if (now - fpsTimer > 500) {
    fpsEl.textContent = Math.round(frameCount * 1000 / (now - fpsTimer));
    frameCount = 0;
    fpsTimer = now;
  }
  counterEl.textContent = String(builtCount).padStart(4, '0');
  progressEl.style.width = (builtCount / totalPoints * 100) + '%';
  
  requestAnimationFrame(render);
}

// ============================================================
// 🎨 SPACE BACKGROUND
// ============================================================
function drawSpaceBackground(t) {
  // Deep gradient
  const grad = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, Math.max(W, H) * 0.9);
  grad.addColorStop(0, '#0a1428');
  grad.addColorStop(0.4, '#050a18');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0.sin, W, H);
  
  // Nebula(t
  const neb1 = ctx.createRadialGradient(W*0 *.25, H*0.35,  0, W*0.25, H*00.35, W*0.55);
.  neb1.addColorStop(0, 'rgba(30, 100, 180, 0.06)');
  neb1.addColorStop(1, 'rgba(30, 100, 180, 0)');
  ctx.fillStyle = neb1;
  ctx.fillRect(0, 0, W, H);
  
  const neb2 = ctx.createRadialGradient(W*0.75, H*0.6, 0, W*0.75, H*0.6, W*0.5);
  neb2.addColorStop(0, 'rgba(120, 40, 200, 0.05)');
  neb2.addColorStop(1, 'rgba(120, 40, 200, 0)');
  ctx.fillStyle = neb2;
  ctx.fillRect(0, 0, W, H);
  
  // Stars with parallax
  for (const layer of starLayers) {
    for (const s of layer.stars) {
      const twinkle = Math001 * s.freq + s.phase) * 0.5 + 0.5;
      ctx.globalAlpha = layer.alpha * (0.3 + twinkle * 0.7);
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(s.x + shakeX * layer.parallax, s.y + shakeY * layer.parallax, layer.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// 📐 GROUND GRID (Sci-Fi)
// ============================================================
function drawGroundGrid(t) {
  const horizonY = H * 0.86;
  const gridHeight = H * 0.14;
  const cols = 20;
  const rows = 6;
  
  ctx.strokeStyle = 'rgba(80, 200, 255, 0.12)';
  ctx.lineWidth = 0.5;
  
  // Horizontal lines (perspective)
  for (let i = 0; i <= rows; i++) {
    const p = i / rows;
    const y = horizonY + p * gridHeight * (1 + p * 0.5);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  
  // Vertical lines (converging to horizon)
  const vpX = W / 2;
  for (let i = 0; i <= cols; i++) {
    const p = i / cols;
    const botX = p * W;
    ctx.beginPath();
    ctx.moveTo(vpX + (botX - vpX) * 0.3, horizonY);
    ctx.lineTo(botX, H);
    ctx.stroke();
  }
  
  // Horizon glow
  const hg = ctx.createLinearGradient(0, horizonY - 30, 0, horizonY + 20);
  hg.addColorStop(0, 'rgba(80, 200, 255, 0)');
  hg.addColorStop(0.6, 'rgba(80, 200, 255, 0.15)');
  hg.addColorStop(1, 'rgba(80, 200, 255, 0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, horizonY - 30, W, 50);
}

// ============================================================
// ☄️ METEOR LOGIC
// ============================================================
function updateMeteors(dt) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    
    if (m.mode === 'falling') {
      m.vy += 0.06 * dt;
      m.vx *= 0.995;
      m.vy *= 0.998;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.spin += m.spinSpeed * dt;
      
      m.trail.push({ x: m.x, y: m.y, life: 1 });
      if (m.trail.length > m.maxTrail) m.trail.shift();
      
      for (let j = 0; j < m.trail.length; j++) {
        m.trail[j].life *= 0.88;
      }
      
      if (m.y > H * 0.28) m.mode = 'attracting';
      
    } else if (m.mode === 'attracting') {
      const target = pyramidTargets[m.target];
      if (!target) { meteors.splice(i, 1); continue; }
      
      const dx = target.x - m.x;
      const dy = target.y - m.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 5) {
        // Settle
        target.settled = true;
        target.settleTime = performance.now();
        settled.push({
          x: target.x,
          y: target.y,
          size: target.size,
          hue: target.hue,
          t: target.t,
          phase: Math.random() * Math.PI * 2
        });
        builtCount++;
        
        spawnDust(target.x, target.y, target.hue, 5, 3);
        shakeAmount = Math.max(shakeAmount, 2.5);
        
        meteors.splice(i, 1);
        continue;
      }
      
      // Bezier-like attraction
      m.vx += dx * 0.008 * dt;
      m.vy += dy * 0.008 * dt;
      m.vx *= 0.93;
      m.vy *= 0.93;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.spin += 0.2 * dt;
      
      m.trail.push({ x: m.x, y: m.y, life: 1 });
      if (m.trail.length > m.maxTrail) m.trail.shift();
      
      for (let j = 0; j < m.trail.length; j++) {
        m.trail[j].life *= 0.9;
      }
    }
    
    // Remove if too far
    if (m.x < -300 || m.x > W + 300 || m.y > H + 300) {
      meteors.splice(i, 1);
    }
  }
}

function drawMeteors() {
  for (const m of meteors) {
    // Trail — multi-color
    for (let i = 0; i < m.trail.length; i++) {
      const tr = m.trail[i];
      const frac = i / m.trail.length;
      const alpha = frac * 0.65;
      const radius = m.size * frac * 0.85;
      if (radius < 0.3) continue;
      
      const trailHue = m.hue + frac * 40;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = hsl(trailHue, 100, 65);
      ctx.shadowBlur = 15 * frac;
      ctx.shadowColor = hsl(trailHue, 100, 60);
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Core glow
    ctx.globalAlpha = 1;
    ctx.fillStyle = hsl(m.hue, 100, 65);
    ctx.shadowBlur = 25;
    ctx.shadowColor = hsl(m.hue, 100, 60);
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size * 1.6, 0, Math.PI * 2);
    ctx.fill();
    
    // White core
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ============================================================
// 🏛️ SETTLED PARTICLES
// ============================================================
function drawSettled(t, dt) {
  for (const p of settled) {
    p.phase += 0.06 * dt;
    const pulse = Math.sin(p.phase) * 0.35 + 0.65;
    const radius = p.size * pulse;
    
    ctx.globalAlpha = 0.85 + pulse * 0.15;
    ctx.fillStyle = hsl(p.hue, 100, 60);
    ctx.shadowBlur = 18 * pulse;
    ctx.shadowColor = hsl(p.hue, 100, 65);
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fill();
    
    // White core
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.shadowColor = hsl(p.hue, 100, 75);
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================================
// 💫 DUST
// ============================================================
function updateDrawDust(dt) {
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.vx *= 0.95;
    d.vy *= 0.95;
    d.vy += d.gravity * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.life -= d.decay * dt;
    
    if (d.life <= 0) { dust.splice(i, 1); continue; }
    
    ctx.globalAlpha = d.life * d.life;
    ctx.fillStyle = hsl(d.hue, 100, 65);
    ctx.shadowBlur = 12 * d.life;
    ctx.shadowColor = hsl(d.hue, 100, 60);
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size * d.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================================
// 🌊 SHOCKWAVES
// ============================================================
function updateDrawShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 18 * dt;
    sw.life -= sw.decay * dt;
    sw.width *= 0.96;
    
    if (sw.life <= 0) { shockwaves.splice(i, 1); continue; }
    
    ctx.globalAlpha = sw.life * sw.life * 0.9;
    ctx.strokeStyle = hsl(sw.hue, 100, 70);
    ctx.lineWidth = sw.width;
    ctx.shadowBlur = 25;
    ctx.shadowColor = hsl(sw.hue, 100, 65);
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================================
// ✨ BLOOM (light bloom overlay)
// ============================================================
function drawBloom() {
  // Simple bloom: overlay gradient based on activity
  if (settled.length < 5) return;
  
  const intensity = Math.min(settled.length / totalPoints, 1) * 0.06;
  ctx.globalAlpha = intensity;
  ctx.globalCompositeOperation = 'lighter';
  const b = ctx.createRadialGradient(W/2, H*0.6, 0, W/2, H*0.6, H*0.8);
  b.addColorStop(0, 'rgba(100, 200, 255, 0.5)');
  b.addColorStop(1, 'rgba(100, 200, 255, 0)');
  ctx.fillStyle = b;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;
}

// ============================================================
// 🎞️ VIGNETTE
// ============================================================
function drawVignette() {
  const v = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.2, W/2, H/2, Math.max(W,H)*0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

// ============================================================
// 🎬 STATE MACHINE
// ============================================================
function updateState(now) {
  if (phase === 'building') {
    if (builtCount >= totalPoints && meteors.length === 0) {
      phase = 'complete';
      phaseEl.textContent = 'RESONATE';
      phaseTime = now;
      
      const cx = W / 2;
      const cy = H * 0.55;
      
      spawnShockwave(cx, cy, 195);
      spawnShockwave(cx, cy, 280);
      spawnShockwave(cx, cy, 35);
      
      shakeAmount = 25;
      flashAlpha = 0.6;
      
      for (let i = 0; i < pyramidTargets.length; i += 4) {
        const t = pyramidTargets[i];
        spawnDust(t.x, t.y, t.hue, 4, 5);
      }
    }
  } 
  else if (phase === 'complete') {
    if (now - phaseTime > 3000) {
      phase = 'collapse';
      phaseEl.textContent = 'COLLAPSE';
      phaseTime = now;
      
      for (const p of settled) {
        dust.push({
          x: p.x, y: p.y,
          vx: (p.x - W/2) * 0.04 + (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          size: p.size * 1.8,
          hue: p.hue,
          life: 1,
          decay: 0.006 + Math.random() * 0.008,
          gravity: 0.3
        });
      }
      settled = [];
      shakeAmount = 35;
    }
  }
  else if (phase === 'collapse') {
    if (now - phaseTime > 2200 && dust.length < 40) {
      resetScene();
    }
  }
}

// ============================================================
// 📱 INTERACTION
// ============================================================
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  spawnShockwave(t.clientX, t.clientY, 195 + Math.random() * 100);
  spawnDust(t.clientX, t.clientY, 195 + Math.random() * 100, 25, 6);
  shakeAmount = 12;
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  spawnShockwave(e.clientX, e.clientY, 195 + Math.random() * 100);
  spawnDust(e.clientX, e.clientY, 195 + Math.random() * 100, 25, 6);
  shakeAmount = 12;
});

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

// ============================================================
// 🚀 START
// ============================================================
buildPyramid();
totalPoints = pyramidTargets.length;
phaseEl.textContent = 'CONSTRUCT';
lastFrame = performance.now();
requestAnimationFrame(render);
</script>
</body>
</html>
