<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test</title>
<style>
  body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; }
  #log {
    position:fixed; top:10px; left:10px;
    color:#0f0; font:12px monospace;
    background:#000a; padding:10px; z-index:99;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="log">Loading...</div>

<script>
var log = document.getElementById('log');
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');

log.textContent = '1. Script started';

try {
  var W = window.innerWidth;
  var H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  log.textContent += '\n2. Canvas: ' + W + 'x' + H;
  
  var t = 0;
  function loop() {
    t++;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);
    
    // دائرة متحركة
    var x = W/2 + Math.cos(t * 0.05) * 100;
    var y = H/2 + Math.sin(t * 0.05) * 100;
    ctx.fillStyle = '#0ff';
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#0ff';
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.fill();
    
    log.textContent = '3. Frame: ' + t + '\n4. Size: ' + W + 'x' + H;
    requestAnimationFrame(loop);
  }
  loop();
  log.textContent += '\n3. Loop started';
} catch(e) {
  log.textContent += '\n\n❌ ERROR: ' + e.message;
  log.style.color = '#f00';
}
</script>
</body>
</html>
