<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MONOLITH</title>
<style>
  * { margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none; color: #fff;
    font-family: sans-serif;
  }
  canvas { display: block; }
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 20px; display: flex;
    justify-content: space-between;
    font-size: 10px; letter-spacing: 3px;
    pointer-events: none; z-index: 10;
    text-transform: uppercase;
  }
  .val { color: #4df; font-size: 14px; text-shadow: 0 0 10px #4df; }
  .lbl { color: rgba(255,255,255,0.3); }
  #debug {
    position: fixed; bottom: 10px; left: 10px;
    font-size: 10px; color: #0f0;
    font-family: monospace; z-index: 100;
    background: rgba(0,0,0,0.6);
    padding: 8px; border-radius: 4px;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div>
    <div class="lbl">Phase</div>
    <div class="val" id="phase">CONSTRUCT</div>
  </div>
  <div style="text-align:right">
    <div class="lbl">Particles</div>
    <div class="val" id="counter">0000</div>
    <div class="lbl" style="margin-top:5px">FPS</div>
    <div class="val" id="fps">--</div>
  </div>
</div>

<div id="debug">جاري التحميل...</div>

<script>
// ==== إعدادات ====
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var phaseEl = document.getElementById('phase');
var counterEl = document.getElementById('counter');
var fpsEl = document.getElementById('fps');
var debugEl = document.getElementById('debug');

var W, H, DPR;

function init() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  debugEl.textContent = 'Canvas: ' + W + 'x' + H + ' DPR:' + DPR;
}

// ==== حساب لون HSL ====
function hsl(h, s, l) {
  return 'hsl(' + h + ',' + s + '%,' + l + '%)';
}

// ==== نجوم الخلفية ====
var bgStars = [];

function makeStars() {
  bgStars = [];
  var count = 150;
  for (var i = 0; i < count; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 1.5 + 0.3,
      alpha: Math.random() * 0.7 + 0.3,
      phase: Math.random() * 6.28,
      freq: 0.5 + Math.random() * 2
    });
  }
}

// ==== الهرم ====
var targets = [];
var totalPoints = 0;

function buildPyramid() {
  targets = [];
  var baseY = H * 0.85;
  var tipY = H * 0.20;
  var ph = baseY - tipY;
  var pw = Math.min(W * 0.85, H * 0.75);
  var cx = W / 2;
  var rows = 20;
  
  for (var row = 0; row < rows; row++) {
    var t = row / (rows - 1);
    var y = tipY + t * ph;
    var width = t * pw;
    var countInRow = Math.max(1, Math.floor(1 + t * 14));
    
    for (var j = 0; j < countInRow; j++) {
      var frac = countInRow === 1 ? 0.5 : j / (countInRow - 1);
      var x = cx - width/2 + frac * width;
      
      var hue;
      if (t < 0.5) {
        hue = 195 + (280 - 195) * (t / 0.5);
      } else {
        hue = 280 + (35 - 280) * ((t - 0.5) / 0.5);
      }
      
      targets.push({
        x: x, y: y,
        size: 2 + Math.random() * 1.5,
        hue: hue,
        row: row,
        reserved: false,
        settled: false
      });
    }
  }
  totalPoints = targets.length;
}

// ==== الشهب ====
var meteors = [];
var lastSpawn = 0;
var spawnInterval = 60;

function spawnMeteor() {
  var idx = -1;
  for (var i = 0; i < targets.length; i++) {
    if (!targets[i].reserved && !targets[i].settled) {
      idx = i;
      targets[i].reserved = true;
      break;
    }
  }
  if (idx < 0) return;
  
  meteors.push({
    x: Math.random() * W,
    y: -30 - Math.random() * 50,
    vx: (Math.random() - 0.5) * 2,
    vy: 4 + Math.random() * 3,
    size: 3 + Math.random() * 2,
    hue: targets[idx].hue,
    trail: [],
    maxTrail: 12,
    target: idx,
    mode: 'falling'
  });
}

// ==== غبار ====
var dust = [];

function spawnDust(x, y, hue, count, power) {
  for (var i = 0; i < count; i++) {
    var angle = Math.random() * 6.28;
    var speed = Math.random() * power + 0.8;
    dust.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 0.8,
      size: 1.5 + Math.random() * 2,
      hue: hue,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      gravity: 0.18
    });
  }
}

// ==== موجات الصدمة ====
var waves = [];

function spawnWave(x, y, hue) {
  waves.push({
    x: x, y: y, r: 5,
    hue: hue, life: 1,
    decay: 0.018, width: 3
  });
}

// ==== الجسيمات المستقرة ====
var settled = [];

// ==== الحالة ====
var phase = 'building';
var builtCount = 0;
var phaseStartTime = 0;
var shakeAmount = 0;
var shakeX = 0, shakeY = 0;
var flashAlpha = 0;

function reset() {
  meteors = [];
  dust = [];
  waves = [];
  settled = [];
  builtCount = 0;
  phase = 'building';
  shakeAmount = 0;
  flashAlpha = 0;
  buildPyramid();
  totalPoints = targets.length;
  phaseEl.textContent = 'CONSTRUCT';
}

// ============================================
// حلقة الرسم — بدون أي شيء معقد
// ============================================
var lastTime = 0;
var frameCount = 0;
var fpsTime = 0;
var frameNum = 0;

function loop(now) {
  if (!lastTime) lastTime = now;
  var dt = (now - lastTime) / 16.667;
  lastTime = now;
  if (dt > 3) dt = 3;
  if (dt < 0.1) dt = 0.1;
  
  frameNum++;
  
  // ============ اهتزاز ============
  if (shakeAmount > 0.2) {
    shakeX = (Math.random() - 0.5) * shakeAmount;
    shakeY = (Math.random() - 0.5) * shakeAmount;
    shakeAmount *= 0.92;
  } else {
    shakeX = 0;
    shakeY = 0;
  }
  
  ctx.save();
  ctx.translate(shakeX, shakeY);
  
  // ============ 1. الخلفية ============
  var grad = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, Math.max(W,H));
  grad.addColorStop(0, '#0a1428');
  grad.addColorStop(0.5, '#050a18');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(-50, -50, W + 100, H + 100);
  
  // نجوم
  for (var i = 0; i < bgStars.length; i++) {
    var s = bgStars[i];
    var tw = Math.sin(now * 0.001 * s.freq + s.phase) * 0.5 + 0.5;
    ctx.globalAlpha = s.alpha * (0.4 + tw * 0.6);
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, 6.28);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  
  // ============ 2. Grid أرضي ============
  drawGrid(now);
  
  // ============ 3. إنشاء شهب ============
  if (phase === 'building' && builtCount < totalPoints) {
    if (now - lastSpawn > spawnInterval) {
      spawnMeteor();
      lastSpawn = now;
    }
  }
  
  // ============ 4. Blend Mode ============
  ctx.globalCompositeOperation = 'lighter';
  
  // ============ 5. الشهب ============
  updateMeteors(dt, now);
  drawMeteors();
  
  // ============ 6. الجسيمات المستقرة ============
  drawSettled(now, dt);
  
  // ============ 7. الغبار ============
  updateDust(dt);
  
  // ============ 8. الموجات ============
  updateWaves(dt);
  
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  
  // ============ 9. Vignette ============
  var v = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  
  // ============ 10. Flash ============
  if (flashAlpha > 0.01) {
    ctx.fillStyle = 'rgba(180,240,255,' + flashAlpha + ')';
    ctx.fillRect(0, 0, W, H);
    flashAlpha *= 0.9;
  }
  
  ctx.restore();
  
  // ============ حالة المشهد ============
  updatePhase(now);
  
  // ============ HUD ============
  frameCount++;
  if (now - fpsTime > 500) {
    fpsEl.textContent = Math.round(frameCount * 1000 / (now - fpsTime));
    frameCount = 0;
    fpsTime = now;
  }
  counterEl.textContent = ('0000' + builtCount).slice(-4);
  
  // ============ Debug ============
  debugEl.textContent = 
    'إطار: ' + frameNum + 
    ' | شهب: ' + meteors.length + 
    ' | ثابتة: ' + settled.length +
    ' | غبار: ' + dust.length;
  
  requestAnimationFrame(loop);
}

// ============================================
// 🎨 رسم Grid
// ============================================
function drawGrid(now) {
  var horizonY = H * 0.85;
  var gridH = H * 0.15;
  var cols = 15;
  var rows = 5;
  
  ctx.strokeStyle = 'rgba(80, 200, 255, 0.15)';
  ctx.lineWidth = 0.5;
  
  for (var i = 0; i <= rows; i++) {
    var p = i / rows;
    var y = horizonY + p * gridH * (1 + p * 0.5);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  
  var vpX = W / 2;
  for15 (var i =;
 0; i <= cols; i   ++) {
    var p = i / cols;
    var ctx botX = p * W;
    ctx.beginPath();
    ctx.moveTo(vpX + (botX - vpX) * 0.3, horizonY);
    ctx.lineTo(botX, H);
    ctx.stroke();
  }
  
  var hg = ctx.createLinearGradient(0, horizonY - 25, 0, horizonY + 15);
 .fillStyle hg.addColorStop(0, 'rgba(80, 200, 255, 0)');
  hg.addColorStop(0.6, 'rgba(80, 200, 255, 0.12)');
  hg.addColorStop(1, 'rgba(80, 200, 255, 0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, horizonY - 25, W, 40);
}

// ============================================
// ☄️ تحديث الشهب
// ============================================
function updateMeteors(dt, now) {
  for (var i = meteors.length - 1; i >= 0; i--) {
    var m = meteors[i];
    
    if (m.mode === 'falling') {
      m.vy += 0.06 * dt;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > m.maxTrail) m.trail.shift();
      
      if (m.y > H * 0.28) m.mode = 'attracting';
      
    } else if (m.mode === 'attracting') {
      var t = targets[m.target];
      if (!t) { meteors.splice(i, 1); continue; }
      
      var dx = t.x - m.x;
      var dy = t.y - m.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      
      if (dist < 5) {
        t.settled = true;
        settled.push({
          x: t.x, y: t.y,
          size: t.size, hue: t.hue,
          phase: Math.random() * 6.28
        });
        builtCount++;
        spawnDust(t.x, t.y, t.hue, 5, 3);
        shakeAmount = Math.max(shakeAmount, 2.5);
        meteors.splice(i, 1);
        continue;
      }
      
      m.vx += dx * 0.008 * dt;
      m.vy += dy * 0.008 * dt;
      m.vx *= 0.93;
      m.vy *= 0.93;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      
      m.trail.push({ x: m.x, y: m.y });
      if (m.trail.length > m.maxTrail) m.trail.shift();
    }
    
    if (m.x < -300 || m.x > W + 300 || m.y > H + 300) {
      meteors.splice(i, 1);
    }
  }
}

// ============================================
// ☄️ رسم الشهب
// ============================================
function drawMeteors() {
  for (var i = 0; i < meteors.length; i++) {
    var m = meteors[i];
    
    // الذيل
    for (var j = 0; j < m.trail.length; j++) {
      var tr = m.trail[j];
      var frac = j / m.trail.length;
      var alpha = frac * 0.65;
      var radius = m.size * frac * 0.85;
      if (radius < 0.3) continue;
      
      ctx.globalAlpha = alpha;
      ctx.fillStyle = hsl(m.hue + frac * 40, 100, 65);
      ctx.shadowBlur = 15 * frac;
      ctx.shadowColor = hsl(m.hue, 100, 60);
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, radius, 0, 6.28);
      ctx.fill();
    }
    
    // الجسم
    ctx.globalAlpha = 1;
    ctx.fillStyle = hsl(m.hue, 100, 65);
    ctx.shadowBlur = 25;
    ctx.shadowColor = hsl(m.hue, 100, 60);
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size * 1.6, 0, 6.28);
    ctx.fill();
    
    // النواة البيضاء
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#fff';
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.size * 0.6, 0, 6.28);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ============================================
// 🏛️ رسم الهرم المستقر
// ============================================
function drawSettled(now, dt) {
  for (var i = 0; i < settled.length; i++) {
    var p = settled[i];
    p.phase += 0.06 * dt;
    var pulse = Math.sin(p.phase) * 0.35 + 0.65;
    var radius = p.size * pulse;
    
    ctx.globalAlpha = 0.85 + pulse * 0. = hsl(p.hue, 100, 60);
    ctx.shadowBlur = 18 * pulse;
    ctx.shadowColor = hsl(p.hue, 100, 65);
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, 6.28);
    ctx.fill();
    
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.shadowColor = hsl(p.hue, 100, 75);
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius * 0.4, 0, 6.28);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================
// 💫 الغبار
// ============================================
function updateDust(dt) {
  for (var i = dust.length - 1; i >= 0; i--) {
    var d = dust[i];
    d.vx *= 0.95;
    d.vy *= 0.95;
    d.vy += d.gravity * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.life -= d.decay * dt;
    
    if (d.life <= 0) { dust.splice(i, 1); continue; }
    
    ctx.globalAlpha = d.life * d.life;
    ctx.fillStyle = hsl(d.hue, 100, 65);
    ctx.shadowBlur = 12 * d.life;
    ctx.shadowColor = hsl(d.hue, 100, 60);
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size * d.life, 0, 6.28);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================
// 🌊 موجات الصدمة
// ============================================
function updateWaves(dt) {
  for (var i = waves.length - 1; i >= 0; i--) {
    var w = waves[i];
    w.r += 18 * dt;
    w.life -= w.decay * dt;
    w.width *= 0.96;
    
    if (w.life <= 0) { waves.splice(i, 1); continue; }
    
    ctx.globalAlpha = w.life * w.life * 0.9;
    ctx.strokeStyle = hsl(w.hue, 100, 70);
    ctx.lineWidth = w.width;
    ctx.shadowBlur = 25;
    ctx.shadowColor = hsl(w.hue, 100, 65);
    ctx.beginPath();
    ctx.arc(w.x, w.y, w.r, 0, 6.28);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// ============================================
// 🎬 حالة المشهد
// ============================================
var completeStart = 0;
var collapseStart = 0;

function updatePhase(now) {
  if (phase === 'building') {
    if (builtCount >= totalPoints && meteors.length === 0) {
      phase = 'complete';
      phaseEl.textContent = 'RESONATE';
      completeStart = now;
      
      spawnWave(W/2, H*0.55, 195);
      spawnWave(W/2, H*0.55, 280);
      spawnWave(W/2, H*0.55, 35);
      
      shakeAmount = 25;
      flashAlpha = 0.6;
      
      for (var i = 0; i < targets.length; i += 4) {
        var t = targets[i];
        spawnDust(t.x, t.y, t.hue, 4, 5);
      }
    }
  } else if (phase === 'complete') {
    if (now - completeStart > 3000) {
      phase = 'collapse';
      phaseEl.textContent = 'COLLAPSE';
      collapseStart = now;
      
      for (var i = 0; i < settled.length; i++) {
        var p = settled[i];
        dust.push({
          x: p.x, y: p.y,
          vx: (p.x - W/2) * 0.04 + (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          size: p.size * 1.8,
          hue: p.hue,
          life: 1,
          decay: 0.006 + Math.random() * 0.008,
          gravity: 0.3
        });
      }
      settled = [];
      shakeAmount = 35;
    }
  } else if (phase === 'collapse') {
    if (now - collapseStart > 2200 && dust.length < 40) {
      reset();
    }
  }
}

// ============================================
// 📱 التفاعل
// ============================================
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.touches.length; i++) {
    var t = e.touches[i];
    spawnWave(t.clientX, t.clientY, 195 + Math.random() * 100);
    spawnDust(t.clientX, t.clientY, 195 + Math.random() * 100, 25, 6);
    shakeAmount = 12;
  }
}, { passive: false });

canvas.addEventListener('mousedown', function(e) {
  spawnWave(e.clientX, e.clientY, 195 + Math.random() * 100);
  spawnDust(e.clientX, e.clientY, 195 + Math.random() * 100, 25, 6);
  shakeAmount = 12;
});

document.addEventListener('gesturestart', function(e) { e.preventDefault(); });

// ============================================
// 🚀 بدء التشغيل
// ============================================
init();
makeStars();
buildPyramid();
totalPoints = targets.length;
phaseEl.textContent = 'CONSTRUCT';

setTimeout(function() {
  lastTime = 0;
  requestAnimationFrame(loop);
}, 100);
</script>
</body>
</html>
