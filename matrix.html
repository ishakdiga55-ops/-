<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MATRIX</title>
<style>
  * { margin: 0; padding: 0; }
  html, body { 
    width: 100%; height: 100%; 
    background: #000; overflow: hidden; 
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');

var width = canvas.width = window.innerWidth;
var height = canvas.height = window.innerHeight;

// أعمدة الأمطار
var columns = Math.floor(width / 20) + 1;
var drops = [];

// الرموز (يابانية + أرقام — مثل الماتريكس الأصلي)
var chars = 'アカサタナハマヤラワイキシチニヒミリウクスツヌフムユルエケセテネヘメレオコソトノホモヨロ0123456789'.split('');

// كل عمود له موقعه وسرعته
for (var x = 0; x < columns; x++) {
  drops[x] = {
    y: Math.random() * -100,       // بداية فوق الشاشة
    speed: 0.5 + Math.random() * 1.5 // سرعة عشوائية
  };
}

// الرسم
function draw() {
  // خلفية شبه شفافة (تعمل كذيل متلاشي)
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, width, height);

  // نص أخضر
  ctx.fillStyle = '#0F0';
  ctx.font = '15px monospace';

  for (var i = 0; i < drops.length; i++) {
    // رمز عشوائي
    var text = chars[Math.floor(Math.random() * chars.length)];
    
    // ارسمه
    ctx.fillText(text, i * 20, drops[i].y * 20);
    
    // حرّك للأسفل
    drops[i].y += drops[i].speed;
    
    // إعادة للتوزيع عند الخروج
    if (drops[i].y * 20 > height && Math.random() > 0.975) {
      drops[i].y = 0;
      drops[i].speed = 0.5 + Math.random() * 1.5;
    }
  }
  
  requestAnimationFrame(draw);
}

draw();

// عند تغيير حجم الشاشة
window.addEventListener('resize', function() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  columns = Math.floor(width / 20) + 1;
  drops = [];
  for (var x = 0; x < columns; x++) {
    drops[x] = {
      y: Math.random() * -100,
      speed: 0.5 + Math.random() * 1.5
    };
  }
});

// منع الزوم
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
</script>
</body>
</html>
